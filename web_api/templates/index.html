<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HunyuanVideo-I2V Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            padding: 40px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #dee2e6;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        
        .upload-section.dragover {
            border-color: #667eea;
            background: #e8f0ff;
        }
        
        .file-input {
            display: none;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
        }
        
        .generate-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }
        
        .video-container {
            text-align: center;
            margin-top: 20px;
        }
        
        .video-container video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .download-btn {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 HunyuanVideo-I2V</h1>
            <p>Transform your images into stunning videos with AI</p>
        </div>
        
        <div class="main-content">
            <form id="generateForm">
                <div class="upload-section" id="uploadSection">
                    <h3>📸 Upload Your Image</h3>
                    <p>Drag and drop an image here or click to browse</p>
                    <input type="file" id="imageFile" class="file-input" accept="image/*" required>
                    <button type="button" class="upload-btn" onclick="document.getElementById('imageFile').click()">
                        Choose Image
                    </button>
                    <p id="fileName" style="margin-top: 10px; color: #666;"></p>
                </div>
                
                <div class="two-column">
                    <div class="form-group">
                        <label for="prompt">🎭 Video Description</label>
                        <textarea id="prompt" placeholder="Describe the motion or scene you want to create..." rows="4">A beautiful scene with gentle motion and cinematic quality</textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="videoLength">⏱️ Video Length (frames)</label>
                        <select id="videoLength">
                            <option value="17">Short (17 frames)</option>
                            <option value="33">Medium (33 frames)</option>
                            <option value="65">Long (65 frames)</option>
                            <option value="129">Very Long (129 frames)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="resolution">📺 Resolution</label>
                        <select id="resolution">
                            <option value="720p">720p HD</option>
                            <option value="540p">540p</option>
                            <option value="360p">360p</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="inferSteps">🔧 Quality Steps</label>
                        <select id="inferSteps">
                            <option value="25">Fast (25 steps)</option>
                            <option value="50" selected>Balanced (50 steps)</option>
                            <option value="100">High Quality (100 steps)</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="seed">🎲 Seed (optional)</label>
                    <input type="number" id="seed" placeholder="Leave empty for random">
                </div>
                
                <button type="submit" class="generate-btn" id="generateBtn">
                    🚀 Generate Video
                </button>
            </form>
            
            <div class="status" id="status"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating your video... This may take a few minutes.</p>
            </div>
            
            <div class="results" id="results">
                <h3>🎉 Your Video is Ready!</h3>
                <div class="video-container" id="videoContainer"></div>
                <div style="text-align: center;">
                    <a href="#" class="download-btn" id="downloadBtn" download>📥 Download Video</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('generateForm');
        const status = document.getElementById('status');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const uploadSection = document.getElementById('uploadSection');
        const fileName = document.getElementById('fileName');
        
        // Drag and drop functionality
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('imageFile').files = files;
                fileName.textContent = `Selected: ${files[0].name}`;
            }
        });
        
        // File input change
        document.getElementById('imageFile').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = `Selected: ${e.target.files[0].name}`;
            }
        });
        
        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const imageFile = document.getElementById('imageFile').files[0];
            
            if (!imageFile) {
                showStatus('Please select an image file.', 'error');
                return;
            }
            
            formData.append('image', imageFile);
            formData.append('prompt', document.getElementById('prompt').value);
            formData.append('video_length', document.getElementById('videoLength').value);
            formData.append('resolution', document.getElementById('resolution').value);
            formData.append('infer_steps', document.getElementById('inferSteps').value);
            
            const seed = document.getElementById('seed').value;
            if (seed) {
                formData.append('seed', seed);
            }
            
            // Show loading state
            document.getElementById('generateBtn').disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            hideStatus();
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('Video generated successfully!', 'success');
                    showResults(data);
                } else {
                    showStatus(data.error || 'Generation failed', 'error');
                }
            } catch (error) {
                showStatus('Network error: ' + error.message, 'error');
            } finally {
                document.getElementById('generateBtn').disabled = false;
                loading.style.display = 'none';
            }
        });
        
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
        
        function hideStatus() {
            status.style.display = 'none';
        }
        
        function showResults(data) {
            const videoContainer = document.getElementById('videoContainer');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // Create video element
            const video = document.createElement('video');
            video.controls = true;
            video.src = data.video_url;
            video.style.maxWidth = '100%';
            
            videoContainer.innerHTML = '';
            videoContainer.appendChild(video);
            
            // Set download link
            downloadBtn.href = data.video_url;
            downloadBtn.download = `hunyuan_video_${data.job_id}.mp4`;
            
            results.style.display = 'block';
        }
        
        // Check API health on load
        fetch('/health')
            .then(response => response.json())
            .then(data => {
                if (data.hunyuan_available) {
                    showStatus('HunyuanVideo-I2V is ready!', 'success');
                } else {
                    showStatus('HunyuanVideo-I2V is not available. Please check the installation.', 'error');
                }
            })
            .catch(error => {
                showStatus('Cannot connect to API server.', 'error');
            });
    </script>
</body>
</html>
